<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=/home.html" />
    <title>Goblett</title>
    <script>
      const testnet = location.pathname.split("/").filter(Boolean)[0] === "testnet"
      if (testnet) {
        const q = new URLSearchParams(location.search)
        q.set("network", "testnet")
        location.replace("/vote.html?" + q.toString())
      } else {
        location.replace("/home.html")
      }
    </script>
  </head>
  <body>
    <p><a href="/home.html">Goblett</a></p>
  </body>
</html>
