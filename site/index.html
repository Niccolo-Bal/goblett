<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goblett · Anonymous elections on Arc</title>
    <meta name="description" content="Anonymous voting on Arc for clubs, student governments and DAOs. Voters register with a wallet and vote from the browser with a zero-knowledge proof. Voters pay no gas." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png?v=2" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Old links: /?election=0x… and /testnet opened the app at the site root.
      ;(() => {
        const q = new URLSearchParams(location.search)
        const testnet = location.pathname.split("/")[1] === "testnet"
        if (q.has("election") || testnet) {
          if (testnet) q.set("network", "testnet")
          location.replace("/app.html?" + q)
        }
      })()
    </script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/look.css" />
  </head>
  <body class="home">
    <header class="topbar home-top">
      <div class="wrap">
        <a class="brand" href="/"><img class="mark" src="/goblett_mark.svg" alt="" width="18" height="32" />Goblett</a>
        <nav class="nav home-nav" aria-label="Main">
          <a href="/why.html">How it Works</a>
          <a class="gh-link" href="https://github.com/Niccolo-Bal/goblett" rel="noopener"><svg class="gh" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>GitHub</a>
          <a class="btn btn-ghost btn-sm" href="/app.html#signin">Sign in</a>
        </nav>
      </div>
    </header>

    <!-- A short calling card. The liquid-metal blob becomes the goblet on hover and every few seconds, and leads to sign-in (morph.js). -->
    <main class="calling">
      <a class="calling-token" id="tokenLink" href="/app.html#signin" aria-label="Sign in">
        <span class="pl-morph" aria-hidden="true">
          <svg class="pl-flame" viewBox="0 0 140 170" width="140" height="170">
            <defs>
              <linearGradient id="plFlame" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="#cfe1ff" /><stop offset="0.45" stop-color="#4c8dff" /><stop offset="1" stop-color="#2f6fe8" />
              </linearGradient>
            </defs>
            <path transform="translate(30 -2) scale(2)" fill="url(#plFlame)" d="M20 2C24 9 30 14 30 23c0 4 2 3 3-1 3 5 3 11-1 15h-6c2-4 0-8-3-10 1 4-2 7-3 10-1-3-4-6-3-10-3 2-5 6-3 10H8c-4-4-4-10-1-15 1 4 3 5 3 1 0-8 7-13 10-21z" />
          </svg>
          <span class="pl-metal"></span>
        </span>
      </a>
      <h1><span>Trustless. Anonymous. Private.</span> <span class="tone">Decentralized secure voting on Arc.</span></h1>
      <p class="calling-sub"><span>For clubs, student governments and DAOs.</span> <span>Nobody can see how you voted, and voters pay no gas.</span></p>
      <div class="calling-actions">
        <a class="btn btn-lg" href="/app.html#signin">Get started</a>
        <a class="btn btn-ghost btn-lg" href="/why.html">How it Works</a>
      </div>
    </main>

    <footer class="footer">
      <div class="wrap">
        <span class="brand"><img class="mark" src="/goblett_mark.svg" alt="" width="18" height="32" />Goblett</span>
        <nav aria-label="Footer">
          <a href="/why.html">How it Works</a>
          <a href="https://github.com/Niccolo-Bal/goblett" rel="noopener">GitHub</a>
          <a href="/app.html">Elections</a>
          <a href="https://github.com/Niccolo-Bal/goblett-relayer" rel="noopener">Run a relayer</a>
          <span>UBC Hackathon 2026</span>
        </nav>
      </div>
    </footer>
    <script type="module">
      import { morph } from "/morph.js"
      const token = document.getElementById("tokenLink")
      morph(token.querySelector(".pl-morph"), { hover: token })
    </script>
  </body>
</html>
